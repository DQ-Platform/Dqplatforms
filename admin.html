<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Sual Və Fayl Əlavə Et</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="number"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>Yeni Sual Və Fayl Əlavə Et</h2>
  <form id="sual-form">
    <div class="form-group">
      <label>Sual Nömrəsi (ID):</label>
      <input type="number" id="sual-id" placeholder="Məs: 1" required>
    </div>

    <div class="form-group">
      <label>Sual Mətni:</label>
      <textarea id="sual-metni" rows="3" placeholder="Sualı yazın..." required></textarea>
    </div>

    <div class="form-group">
      <label>Düzgün Cavab:</label>
      <input type="text" id="sual-cavab" placeholder="Məs: A" required>
    </div>

    <div class="form-group">
      <label>Fayl Əlavə Et (Şəkil, PDF, DOCX):</label>
      <input type="file" id="sual-fayl" accept="image/*, .pdf, .docx, .doc">
    </div>

    <button type="submit" id="btn-submit">Sualı Bazaya Yaz</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // 1. Supabase Bağlantısı
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('sual-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('btn-submit');

    statusDiv.style.color = "blue";
    statusDiv.innerText = "Yüklənir...";
    submitBtn.disabled = true;

    const sualId = document.getElementById('sual-id').value;
    const sualMetni = document.getElementById('sual-metni').value;
    const sualCavab = document.getElementById('sual-cavab').value;
    const faylInput = document.getElementById('sual-fayl').files[0];

    let faylUrl = null;
    let faylTipi = null;

    try {
      // 2. Fayl varsa Supabase Storage-ə yükləyirik
      if (faylInput) {
        const fileExt = faylInput.name.split('.').pop().toLowerCase();
        const fileName = `sual_${sualId}_${Date.now()}.${fileExt}`;

        const { data: uploadData, error: uploadError } = await db.storage
          .from('suallar-fayllar')
          .upload(fileName, faylInput);

        if (uploadError) throw uploadError;

        // Public URL alırıq
        const { data: urlData } = db.storage
          .from('suallar-fayllar')
          .getPublicUrl(fileName);

        faylUrl = urlData.publicUrl;

        // Fayl tipini müəyyənləşdiririk
        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExt)) {
          faylTipi = 'image';
        } else if (fileExt === 'pdf') {
          faylTipi = 'pdf';
        } else if (['doc', 'docx'].includes(fileExt)) {
          faylTipi = 'docx';
        }
      }

      // 3. Sual məlumatlarını bazaya daxil edirik
      const { error: dbError } = await db
        .from('suallar')
        .insert([{ 
          id: sualId, 
          metn: sualMetni, 
          cavab: sualCavab, 
          fayl_url: faylUrl, 
          fayl_tipi: faylTipi 
        }]);

      if (dbError) throw dbError;

      statusDiv.style.color = "green";
      statusDiv.innerText = "Sual və fayl uğurla əlavə edildi!";
      document.getElementById('sual-form').reset();

    } catch (err) {
      statusDiv.style.color = "red";
      statusDiv.innerText = "Xəta baş verdi: " + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
