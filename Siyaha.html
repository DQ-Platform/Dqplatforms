<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İştirakçılar və İcazələr - DQ Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-dark: #0f172a; --accent-gold: #d4af37; --success-green: #10b981; --danger-red: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08); border-top: 4px solid var(--accent-gold); }
        h2 { color: var(--primary-dark); text-align: center; margin-top: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { background-color: var(--primary-dark); color: var(--accent-gold); border: none; padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn:hover { background-color: #1e293b; }
        .btn-danger { background-color: var(--danger-red); color: white; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-success { background-color: var(--success-green); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin: 2px; }
        
        .add-card { background: #f1f5f9; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 25px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-control { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; flex: 1; min-width: 150px; }
        .form-control:focus { border-color: var(--accent-gold); }
        
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; margin-top: 10px; }
        th, td { padding: 12px 10px; border: 1px solid #cbd5e1; }
        th { background: var(--primary-dark); color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-blocked { background: #fef2f2; color: #991b1b; }
        .token-field { letter-spacing: 1px; font-weight: bold; font-family: monospace; }
        .footer-back { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>👥 İştirakçılar və İcazələrin İdarə Edilməsi</h2>
            <a href="index.html" class="btn">🏠 Əsas Panələ Qayıt</a>
        </div>

        <!-- Yeni İştirakçı Və Kateqoriya Əlavə Etmə -->
        <div class="add-card">
            <h4 style="margin-top: 0; color: var(--primary-dark);">➕ Yeni İştirakçı Və Kateqoriya Əlavə Et</h4>
            <div class="form-row">
                <input type="text" id="new-name" class="form-control" placeholder="Ad Soyad">
                <input type="text" id="new-fin" class="form-control token-field" placeholder="FIN Kod (7 simvol)" maxlength="7">
                <select id="new-category" class="form-control">
                    <option value="BA">Kateqoriya: BA</option>
                    <option value="BB1">Kateqoriya: BB1</option>
                    <option value="BB2">Kateqoriya: BB2</option>
                    <option value="BB3">Kateqoriya: BB3</option>
                    <option value="BB4">Kateqoriya: BB4</option>
                    <option value="Ümumi">Kateqoriya: Ümumi Sınaq</option>
                </select>
                <button class="btn btn-success" onclick="addNewStudent()">Əlavə Et</button>
            </div>
            <p id="status-msg" style="margin: 8px 0 0 0; font-size: 13px; font-weight: bold;"></p>
        </div>

        <!-- İştirakçı Siyahısı Cədvəli -->
        <h4 style="margin-bottom: 10px; color: var(--primary-dark);">📋 Qeydiyyatda Olan İştirakçılar</h4>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>FIN Kod</th>
                        <th>Kateqoriya</th>
                        <th>İcazə Statusu</th>
                        <th>Əməliyyatlar / İdarəetmə</th>
                    </tr>
                </thead>
                <tbody id="students-table-body">
                    <tr><td colspan="5">Məlumatlar mərkəzi bazadan yüklənir...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer-back">
            <a href="index.html" class="btn">🔙 Panələ Qayıt</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://cpzwliqlgaplroscvduo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1clDyHhxAiSCurwGHwMi3g_rrs17eYF";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener("DOMContentLoaded", loadStudentsList);

        async function loadStudentsList() {
            const tbody = document.getElementById("students-table-body");
            const { data, error } = await _supabase
                .from('allowed_students')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Xəta baş verdi: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5">Sistemdə heç bir iştirakçı tapılmadı.</td></tr>`;
                return;
            }

            let html = "";
            data.forEach(s => {
                const isBlocked = s.is_blocked || false;
                const statusBadge = isBlocked 
                    ? `<span class="badge badge-blocked">⛔ İştirak Dayandırılıb</span>` 
                    : `<span class="badge badge-active">✅ Aktiv (İcazəli)</span>`;

                const toggleBtn = isBlocked
                    ? `<button class="btn-sm btn-success" onclick="toggleStudentStatus('${s.fin}', false)">▶️ İcazəni Bərpa Et</button>`
                    : `<button class="btn-sm btn-warning" onclick="toggleStudentStatus('${s.fin}', true)">⏸️ İştirakı Dayandır</button>`;

                html += `
                    <tr>
                        <td><b>${s.name || '-'}</b></td>
                        <td class="token-field">${s.fin}</td>
                        <td>
                            <select onchange="updateCategory('${s.fin}', this.value)" style="padding: 4px; border-radius: 4px;">
                                <option value="BA" ${s.category === 'BA' ? 'selected' : ''}>BA</option>
                                <option value="BB1" ${s.category === 'BB1' ? 'selected' : ''}>BB1</option>
                                <option value="BB2" ${s.category === 'BB2' ? 'selected' : ''}>BB2</option>
                                <option value="BB3" ${s.category === 'BB3' ? 'selected' : ''}>BB3</option>
                                <option value="BB4" ${s.category === 'BB4' ? 'selected' : ''}>BB4</option>
                                <option value="Ümumi" ${!s.category || s.category === 'Ümumi' ? 'selected' : ''}>Ümumi Sınaq</option>
                            </select>
                        </td>
                        <td>${statusBadge}</td>
                        <td>
                            ${toggleBtn}
                            <button class="btn-sm btn-danger" onclick="deleteStudent('${s.fin}')">🗑️ Sil</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        async function addNewStudent() {
            const name = document.getElementById("new-name").value.trim();
            const fin = document.getElementById("new-fin").value.trim().toUpperCase();
            const category = document.getElementById("new-category").value;
            const msg = document.getElementById("status-msg");

            if (!name || fin.length < 5) {
                msg.style.color = "red";
                msg.innerText = "Ad və etibarlı FIN kod daxil edin!";
                return;
            }

            const { error } = await _supabase
                .from('allowed_students')
                .insert([{ name: name, fin: fin, category: category, is_blocked: false }]);

            if (error) {
                msg.style.color = "red";
                msg.innerText = "Xəta: " + error.message;
            } else {
                msg.style.color = "green";
                msg.innerText = "İştirakçı uğurla əlavə olundu!";
                document.getElementById("new-name").value = "";
                document.getElementById("new-fin").value = "";
                loadStudentsList();
            }
        }

        async function toggleStudentStatus(fin, blockStatus) {
            const { error } = await _supabase
                .from('allowed_students')
                .update({ is_blocked: blockStatus })
                .eq('fin', fin);

            if (error) alert("Xəta baş verdi: " + error.message);
            else loadStudentsList();
        }

        async function updateCategory(fin, newCategory) {
            const { error } = await _supabase
                .from('allowed_students')
                .update({ category: newCategory })
                .eq('fin', fin);

            if (error) alert("Kateqoriya yenilənmədi: " + error.message);
            else loadStudentsList();
        }

        async function deleteStudent(fin) {
            if (confirm(`${fin} FİN kodlu iştirakçını ləğv etmək istədiyinizə əminsiniz?`)) {
                const { error } = await _supabase
                    .from('allowed_students')
                    .delete()
                    .eq('fin', fin);

                if (error) alert("Silinərkən xəta baş verdi: " + error.message);
                else loadStudentsList();
            }
        }
    </script>
</body>
</html>
