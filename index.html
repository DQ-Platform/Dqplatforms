<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ Platform - Giriş</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1b2a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: #e0e1dd;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p.subtitle {
            color: #778da9;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e1dd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #415a77;
            background-color: #0d1b2a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border: none;
            border-radius: 6px;
            color: #0d1b2a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #778da9;
            text-align: center;
        }

        .admin-trigger {
            cursor: pointer;
            color: #778da9;
            transition: color 0.2s;
        }

        .admin-trigger:hover {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DQ Platform</h1>
        <p class="subtitle">İmtahan Sistemünə Giriş</p>

        <div class="input-group">
            <label for="accessCode">Giriş Kodunuzu Daxil Edin:</label>
            <input type="text" id="accessCode" placeholder="Məsələn: DQ-1234" autocomplete="off">
        </div>

        <button onclick="checkAccess()">Daxil Ol</button>

        <div id="error" class="error-msg">Daxil etdiyiniz kod yanlışdır və ya müddəti bitib!</div>
    </div>

    <div class="footer">
        © 2026 DQ Platform – Developed <span class="admin-trigger" onclick="openAdminLogin()">by</span> Yunis İmanov
    </div>

    <script>
        function checkAccess() {
            const codeInput = document.getElementById('accessCode').value.trim();
            const errorDiv = document.getElementById('error');

            if (!codeInput) {
                errorDiv.innerText = "Lütfən giriş kodunu daxil edin!";
                errorDiv.style.display = "block";
                return;
            }

            // Şifrə daxil edildikdə yoxlanış
            if (codeInput === "DQ-EXAM-2026" || codeInput === "6675157") {
                errorDiv.style.display = "none";
                localStorage.setItem("userAuth", "true");
                window.location.href = "exam.html"; // İmtahan səhifəsinə yönləndirmə
            } else {
                errorDiv.innerText = "Daxil etdiyiniz kod yanlışdır və ya müddəti bitib!";
                errorDiv.style.display = "block";
            }
        }

        // Enter düyməsinə basıldıqda da işləməsi üçün
        document.getElementById("accessCode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAccess();
            }
        });

        // GİZLİ ADMİN PANELƏ GİRİŞ FUNKSİYASI ("by" sözünə kliklədikdə)
        function openAdminLogin() {
            let pass = prompt("Admin paneli üçün şifrəni daxil edin:");
            if (pass === "yunis2026" || pass === "6675157") {
                window.location.href = "admin.html";
            } else if (pass !== null && pass !== "") {
                alert("Yanlış admin şifrəsi!");
            }
        }
    </script>
</body>
</html>
