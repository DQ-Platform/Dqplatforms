<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ Platform - Dövlət Qulluğu Sınaq İmtahanı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; align-items: center; padding: 20px; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: auto; text-align: center; }
        h2 { color: #1a1a1a; margin-bottom: 8px; font-size: 20px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #ff7a59; }
        button { width: 100%; padding: 12px; background-color: #ff7a59; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #ff623b; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
        footer { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>DQ Platform - Giriş</h2>
        <p>Zəhmət olmasa məlumatlarınızı daxil edin</p>
        
        <div class="form-group">
            <label for="fullName">Ad və Soyad</label>
            <input type="text" id="fullName" placeholder="Məs: Əli Məmmədov">
        </div>

        <div class="form-group">
            <label for="finCode">FİN Kod</label>
            <input type="text" id="finCode" placeholder="Məs: 7P7GS57" style="text-transform: uppercase;">
        </div>

        <button onclick="checkAccess()">Daxil ol</button>
        <div id="errorMsg" class="error-msg">Bu FİN kod üçün icazə tapılmadı və ya ödəniş təsdiqlənmədi.</div>
    </div>

    <footer>
        © 2026 DQ Platform – Developed by Yunis İmanov
    </footer>

    <script>
        function checkAccess() {
            const nameInput = document.getElementById('fullName').value.trim();
            const finInput = document.getElementById('finCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');

            if (nameInput === "" || finInput === "") {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Zəhmət olmasa bütün xanaları doldurun!";
                return;
            }

            let students = localStorage.getItem('yunisAllowedStudents');
            let allowedList = students ? JSON.parse(students) : [];

            let found = allowedList.find(s => s.fin === finInput);

            if (found) {
                localStorage.setItem('studentName', found.name);
                localStorage.setItem('studentFin', found.fin);
                window.location.href = "exam.html"; 
            } else {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Bu FİN kod sistemdə aktiv deyil. Ödəniş etmisinizsə administratorla əlaqə saxlayın.";
            }
        }
    </script>
</body>
</html>
