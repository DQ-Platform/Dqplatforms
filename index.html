<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>"Məhkəmələr və hakimlər haqqında" AR Qanunu</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        
        /* Top Navbar */
        .top-navbar { background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; font-size: 14px; }
        .top-left { display: flex; align-items: center; gap: 10px; color: #333; font-weight: bold; }
        .top-center { font-weight: bold; color: #222; font-size: 15px; }
        .top-icons { display: flex; gap: 15px; color: #555; cursor: pointer; font-size: 18px; }

        /* Main Container */
        .app-container { display: flex; max-width: 1200px; margin: 20px auto; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }

        /* Left Sidebar (Question Info) */
        .left-sidebar { width: 220px; background: #fff; border-right: 1px solid #eee; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .q-num-box { color: #6c757d; font-size: 13px; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .q-big-number { font-size: 36px; font-weight: bold; color: #000; margin-bottom: 15px; }
        .score-box { border-top: 1px solid #eee; border-bottom: 1px solid #eee; width: 100%; padding: 12px 0; margin-bottom: 15px; }
        .score-val { color: #007bff; font-weight: bold; font-size: 14px; margin-bottom: 3px; }
        .score-label { color: #6c757d; font-size: 12px; }
        .doubt-btn { border: 1px solid #ddd; background: #fff; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 13px; color: #555; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .doubt-btn:hover { background: #f9f9f9; }

        /* Center Content (Question & Options) */
        .main-content { flex: 1; padding: 30px; }
        .sub-header { color: #6c757d; font-size: 13px; margin-bottom: 8px; }
        .question-title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 25px; line-height: 1.4; }
        
        .option { display: flex; align-items: flex-start; background: #fff; border: 1px solid #e0e0e0; padding: 14px 16px; margin-bottom: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; gap: 12px; }
        .option:hover { background: #f8f9fa; border-color: #ccc; }
        .option input { margin-top: 3px; cursor: pointer; }
        .option-letter { font-weight: bold; color: #555; min-width: 15px; }
        .option-text { color: #333; font-size: 14px; line-height: 1.4; }

        /* Right Sidebar (Navigation) */
        .right-sidebar { width: 280px; background: #fff; border-left: 1px solid #eee; padding: 20px; }
        .nav-header-box { background: #007bff; color: white; padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .category-title { font-size: 13px; font-weight: bold; color: #444; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .nav-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; color: #333; }
        .nav-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .nav-btn:hover:not(.active) { background: #e9ecef; }
        
        .finish-btn { width: 100%; background: #2b6cb0; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .finish-btn:hover { background: #23528a; }
    </style>
</head>
<body>

    <!-- Yuxarı Navbar -->
    <div class="top-navbar">
        <div class="top-left">
            <span style="cursor:pointer; font-size: 18px;">✕</span>
            <span style="cursor:pointer; font-size: 18px;">🎚️</span>
        </div>
        <div class="top-center">"Məhkəmələr və hakimlər haqqında" AR Qanunu</div>
        <div class="top-icons">
            <span>🔗</span>
            <span>🔖</span>
            <span>⋮</span>
        </div>
    </div>

    <!-- Əsas Konteyner -->
    <div class="app-container">
        
        <!-- Sol Panel (Sual məlumatı) -->
        <div class="left-sidebar">
            <div class="q-num-box">📄 Sualın nömrəsi</div>
            <div class="q-big-number">1</div>
            <div class="score-box">
                <div class="score-val">1.00 bal</div>
                <div class="score-label">ilə qiymətləndirilir</div>
            </div>
            <button class="doubt-btn">
                <span>🚩</span> Tərəddüdlü sual
            </button>
        </div>

        <!-- Mərkəzi Sual Bloku -->
        <div class="main-content">
            <div class="sub-header">"Məhkəmələr və hakimlər haqqında" Azərbaycan Respublikasının Qanununa əsasən:</div>
            <div class="question-title">Azərbaycan Respublikasının Qanununa əsasən yanlışdır:</div>
            
            <div id="options-container">
                <label class="option">
                    <input type="radio" name="opt">
                    <span class="option-letter">a.</span>
                    <span class="option-text">Azərbaycan Respublikası Konstitusiya Məhkəməsinin statusu və fəaliyyəti "Konstitusiya Məhkəməsi haqqında" Azərbaycan Respublikasının qanunu ilə müəyyən olunur.</span>
                </label>
                <label class="option">
                    <input type="radio" name="opt">
                    <span class="option-letter">b.</span>
                    <span class="option-text">Azərbaycan Respublikası məhkəmələrinin fəaliyyəti yalnız adət mühakiməsinin və qanunvericiliklə müəyyən edilmiş hallarda və qaydada məhkəmə nəzarətinin həyata keçirilməsinə yönəldilmişdir.</span>
                </label>
                <label class="option">
                    <input type="radio" name="opt">
                    <span class="option-letter">c.</span>
                    <span class="option-text">Məhkəmələrin üzərinə "Məhkəmələr və hakimlər haqqında" Qanunla vəzifələr qoyula bilər.</span>
                </label>
                <label class="option">
                    <input type="radio" name="opt">
                    <span class="option-letter">d.</span>
                    <span class="option-text">Məhkəmələr ədalət mühakiməsini həyata keçirərkən Azərbaycan Respublikası Konstitusiyasında təsbit edilmiş insan və vətəndaş hüquqlarını və azadlıqlarını, mülkiyyət formasından asılı olmayaraq bütün müəssisə, idarə və təşkilatların, siyasi partiyaların, ictimai birliklərin, digər hüquqi şəxslərin hüquqlarını və qanuni mənafelərini hər cür qəsdlərdən və qanun pozuntularından müdafiə edir, Azərbaycan Respublikasının Konstitusiyasında və bu qanunda nəzərdə tutulmuş digər vəzifələri həyata keçirirlər.</span>
                </label>
            </div>
        </div>

        <!-- Sağ Panel (Naviqasiya) -->
        <div class="right-sidebar">
            <div class="category-title">
                <span>📑</span> Qanunvericilik
            </div>
            <div class="nav-grid">
                <button class="nav-btn active">1</button>
                <button class="nav-btn">2</button>
                <button class="nav-btn">3</button>
                <button class="nav-btn">4</button>
                <button class="nav-btn">5</button>
                <button class="nav-btn">6</button>
                <button class="nav-btn">7</button>
                <button class="nav-btn">8</button>
                <button class="nav-btn">9</button>
                <button class="nav-btn">10</button>
                <button class="nav-btn">11</button>
                <button class="nav-btn">12</button>
                <button class="nav-btn">13</button>
                <button class="nav-btn">14</button>
                <button class="nav-btn">15</button>
                <button class="nav-btn">16</button>
                <button class="nav-btn">17</button>
                <button class="nav-btn">18</button>
                <button class="nav-btn">19</button>
                <button class="nav-btn">20</button>
                <button class="nav-btn">21</button>
                <button class="nav-btn">22</button>
                <button class="nav-btn">23</button>
                <button class="nav-btn">24</button>
                <button class="nav-btn">25</button>
            </div>
            <button class="finish-btn">
                <span>✓</span> İmtahanı bitir
            </button>
        </div>

    </div>

</body>
</html>
