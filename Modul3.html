<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Mərkəzi — DQ Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --gold: #d97706;
            --green: #238636;
            --blue: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .catalog-header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 35px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            box-sizing: border-box;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
        }

        .file-tree {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .folder-bar {
            background: #21262d;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: #1f242c; }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info i { color: var(--blue); }

        .file-link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
        }

        .file-link:hover { color: var(--blue); text-decoration: underline; }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-active { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }

        .btn-launch {
            background: var(--green);
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-launch:hover { background: #2ea043; }
    </style>
</head>
<body>

<div class="container">
    <div class="catalog-header">
        <div>
            <h2 style="margin: 0; color: var(--gold);">📁 Modul Kataloqu</h2>
            <small style="color: #8b949e;">Mərkəzləşdirilmiş sistem alt-faylları v1.0</small>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search" placeholder="Modul axtar..." onkeyup="filterFiles()">
        </div>
    </div>

    <div class="file-tree">
        <div class="folder-bar">
            <i class="fa-solid fa-folder-open" style="color: var(--gold);"></i>
            <span>root / modules /</span>
        </div>
        <div id="file-list">
            <!-- Modullar JavaScript ilə təşkil olunur -->
        </div>
    </div>
</div>

<script>
    // GitHub repozitoriyasındakı bütün işlək modul faylları
    const moduleFiles = [
        { name: "Idare.html", label: "İdarə Paneli Mərkəzi", status: "İşlək" },
        { name: "Kabinet.html", label: "Şəxsi Kabinet Paneli", status: "İşlək" },
        { name: "Kod.html", label: "Access / Giriş Kodları", status: "İşlək" },
        { name: "Kontrol.html", label: "İmtahan Monitorinq Mərkəzi", status: "İşlək" },
        { name: "Modul3.html", label: "Əlavə Sistem Modulu", status: "İşlək" },
        { name: "Pult.html", label: "Operativ İdarəetmə Pultu", status: "İşlək" },
        { name: "Siyaha.html", label: "İştirakçı Bazası və Siyahı", status: "İşlək" },
        { name: "Statistika.html", label: "Analitika və Hesabatlar", status: "İşlək" },
        { name: "Suallar.html", label: "Test və Suallar Bazası", status: "İşlək" },
        { name: "admin.html", label: "Mərkəzi Admin Arayüzü", status: "İşlək" },
        { name: "index.html", label: "Əsas Başlanğıc Səhifəsi", status: "İşlək" },
        { name: "redakte.html", label: "Məzmun Redaktə Modulu", status: "İşlək" },
        { name: "Cavablar.html", label: "Neticə və Cavablar Paneli", status: "İşlək" }
    ];

    function renderCatalog(files) {
        const container = document.getElementById("file-list");
        container.innerHTML = "";

        files.forEach(f => {
            const item = document.createElement("div");
            item.className = "file-item";
            item.innerHTML = `
                <div class="file-info">
                    <i class="fa-regular fa-file-code fa-lg"></i>
                    <div>
                        <a href="${f.name}" class="file-link">${f.name}</a>
                        <div style="font-size: 0.8rem; color: #8b949e;">${f.label}</div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span class="status-badge status-active">${f.status}</span>
                    <a href="${f.name}" class="btn-launch">Aç <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.75rem;"></i></a>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function filterFiles() {
        const query = document.getElementById("search").value.toLowerCase();
        const filtered = moduleFiles.filter(f => f.name.toLowerCase().includes(query) || f.label.toLowerCase().includes(query));
        renderCatalog(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => renderCatalog(moduleFiles));
</script>

</body>
</html>
