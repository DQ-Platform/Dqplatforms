<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sınaq İmtahanı Nəticəsi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #fdfdfd; padding: 15px; color: #222; }
    .card { background: #fff; max-width: 850px; margin: 0 auto; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 15px; font-weight: 700; color: #111; line-height: 1.4; margin-bottom: 6px; }
    .user-name { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #000; }

    .subject-block { margin-bottom: 18px; }
    .subject-title { font-size: 12px; font-weight: 700; color: #333; margin-bottom: 6px; }
    
    .table-wrapper { overflow-x: auto; width: 100%; border: 1px solid #ccc; border-radius: 2px; }
    .result-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 10px; table-layout: fixed; }
    .result-table th, .result-table td { border: 1px solid #ddd; padding: 3px 1px; min-width: 18px; height: 22px; font-weight: normal; }
    .result-table th { background-color: #fafafa; font-weight: bold; color: #444; width: 42px; }
    
    .summary-text { font-size: 12px; color: #333; margin: 15px 0 12px 0; text-align: center; }
    .summary-text span { font-weight: bold; }

    .score-box { background-color: #fdf2f2; border: 1px solid #f8b4b4; border-radius: 6px; padding: 12px; text-align: center; margin-bottom: 15px; }
    .score-title { font-size: 15px; font-weight: bold; color: #c0392b; margin-bottom: 3px; }
    .score-sub { font-size: 12px; color: #444; font-weight: 500; }

    /* Şəkildəki 2 Düymə Yan-Yana Stil */
    .btn-group { display: flex; gap: 10px; justify-content: center; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-view { background-color: #0d1b2a; color: #f1c40f; }
    .btn-home { background-color: #10b981; color: #fff; }

    .footer-credits { text-align: center; font-size: 11px; color: #777; margin-top: 20px; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <header class="header">
    <h2>Dövlət qulluğu vəzifələri üzrə test imtahanının nəticələri</h2>
    <div class="user-name" id="userName">YUNİS</div>
  </header>

  <div id="tablesContainer"></div>

  <div class="summary-text">
    Doğru: <span id="totalCorrect">0</span> | Yanlış: <span id="totalWrong">0</span> | Cavabsız: <span id="totalUnanswered">0</span>
  </div>

  <div class="score-box">
    <div class="score-title" id="finalScoreText">YEKUN BAL: 0 bal</div>
    <div class="score-sub" id="finalStatusText">Uyğun nəticə toplanmadı</div>
  </div>

  <!-- İki Düymə Bloku -->
  <div class="btn-group">
    <button class="btn btn-view" onclick="viewQuestions()">🔍 Suallara Baxış</button>
    <button class="btn btn-home" onclick="goHome()">🏠 Əsas Səhifəyə Qayıt</button>
  </div>

  <div class="footer-credits">
    © 2026 DQ Platform -- Developed by Yunis İmanov
  </div>
</div>

<script>
function calculateSubgroup(group, score) {
  const g = group ? group.toUpperCase().trim() : '';
  if (g === 'BA') {
    if (score >= 102) return 'BA1';
    if (score >= 96) return 'BA2';
    if (score >= 90) return 'BA3';
    if (score >= 84) return 'BA4';
    return 'Uyğun nəticə toplanmadı';
  } else if (g === 'AC') {
    if (score >= 80) return 'AC1';
    if (score >= 75) return 'AC2';
    if (score >= 70) return 'AC3';
    if (score >= 65) return 'AC4';
    return 'Uyğun nəticə toplanmadı';
  } else if (g === 'BB') {
    if (score >= 80) return 'BB1';
    if (score >= 75) return 'BB2';
    if (score >= 70) return 'BB3';
    if (score >= 65) return 'BB4';
    return 'Uyğun nəticə toplanmadı';
  }
  return 'Uyğun nəticə toplanmadı';
}

// Açıq sual nömrələri (3 Az. dili, 8 Qanun, 3 İnfo, 6 Məntiq)
const openQuestionIds = [13, 14, 15, 48, 49, 50, 51, 52, 53, 54, 55, 68, 69, 70, 95, 96, 97, 98, 99, 100];

const examData = [
  { title: "Azərbaycan dili", questions: createQuestions(1, 15) },
  { title: "Qanunvericilik", questions: createQuestions(16, 55) },
  { title: "İnformatika", questions: createQuestions(56, 70) },
  { title: "Məntiq", questions: createQuestions(71, 100) }
];

function createQuestions(start, end) {
  let list = [];
  for (let i = start; i <= end; i++) {
    const isOpen = openQuestionIds.includes(i);
    list.push({
      id: i,
      etalon: isOpen ? "1,2" : "A",
      user: "", 
      points: isOpen ? 2 : 1
    });
  }
  return list;
}

function renderExamResult(data, userGroup) {
  const container = document.getElementById('tablesContainer');
  container.innerHTML = '';

  let totalCorrect = 0;
  let totalWrong = 0;
  let totalUnanswered = 0;
  let totalScore = 0;

  data.forEach(sub => {
    const block = document.createElement('div');
    block.className = 'subject-block';

    let tableHtml = `<div class="subject-title">${sub.title}</div>
      <div class="table-wrapper">
        <table class="result-table">
          <tr><th>Nº</th>`;
    
    let etalonRow = '<tr><th>Etalon</th>';
    let userRow = '<tr><th>İştirakçı</th>';
    let resultRow = '<tr><th>Nəticə</th>';

    sub.questions.forEach(q => {
      tableHtml += `<td>${q.id}</td>`;
      etalonRow += `<td>${q.etalon}</td>`;
      userRow += `<td>${q.user ? q.user : ''}</td>`;

      if (!q.user) {
        resultRow += '<td>-</td>';
        totalUnanswered++;
      } else if (q.user.trim().toUpperCase() === q.etalon.trim().toUpperCase()) {
        resultRow += '<td>+</td>';
        totalCorrect++;
        totalScore += q.points;
      } else {
        resultRow += '<td>-</td>';
        totalWrong++;
      }
    });

    tableHtml += `</tr>${etalonRow}</tr>${userRow}</tr>${resultRow}</tr></table></div>`;
    block.innerHTML = tableHtml;
    container.appendChild(block);
  });

  document.getElementById('totalCorrect').textContent = totalCorrect;
  document.getElementById('totalWrong').textContent = totalWrong;
  document.getElementById('totalUnanswered').textContent = totalUnanswered;
  
  document.getElementById('finalScoreText').textContent = `YEKUN BAL: ${totalScore} bal`;
  
  const subGroupResult = calculateSubgroup(userGroup, totalScore);
  document.getElementById('finalStatusText').textContent = (subGroupResult.startsWith('BA') || subGroupResult.startsWith('BB') || subGroupResult.startsWith('AC')) 
    ? `Keçid balını topladı (${subGroupResult})` 
    : subGroupResult;
}

function viewQuestions() {
  window.location.href = "exam_review.html"; // Suallara baxış səhifənizin ünvanı
}

function goHome() {
  window.location.href = "index.html"; // Əsas səhifə ünvanı
}

renderExamResult(examData, 'BA');
</script>

</body>
</html>
